<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/app.css" rel="stylesheet">
</head>

<!-- CHANGE: Added Bootstrap flexbox classes to body -->
<body class="auth-bg">
    
    <!-- CHANGE: Added a wrapper div with a max-width and card styling -->
    <div class="auth-card">
        <form onsubmit="return login(event)">
            <div class="auth-mark">F</div>
            <h1 class="h3 mb-2 text-center">Welcome back</h1>
            <p class="auth-note text-center mb-4">Sign in to continue to your FinTrack workspace.</p>
            <div id="message" aria-live="polite"></div>
            
            <label class="form-label" for="login-email">Email</label>
            <input class="form-control mb-3" type="email" id="login-email" required>
            
            <label class="form-label" for="login-password">Password</label>
            <input class="form-control mb-3" type="password" id="login-password" required>
            
            <button class="btn btn-primary w-100 mt-2">Sign in</button>
            <a href="/register" class="auth-link d-block mt-3 text-center">Create account</a>
        </form>
    </div>
    
    <script src="/static/js/app.js"></script>
</body>
</html>
