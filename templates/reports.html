{% extends "layout.html" %}{% block content %}<div class="card mb-3"><div class="card-body row g-2 align-items-end"><div class="col-sm-4"><label class="form-label">From</label><input class="form-control" type="date" id="report-start"></div><div class="col-sm-4"><label class="form-label">To</label><input class="form-control" type="date" id="report-end"></div><div class="col-sm-4 d-flex gap-2"><button class="btn btn-primary" onclick="loadReports()">Apply</button><button class="btn btn-outline-secondary" onclick="exportReportCsv()">Export CSV</button></div></div></div><div class="row g-3 mb-3" id="report-cards"></div><div class="card mb-3"><div class="card-body"><h2 class="h6">Invoice status summary</h2><div id="invoice-status-summary" class="d-flex flex-wrap gap-2"></div></div></div><div class="row g-3"><div class="col-xl-6"><div class="card chart-card"><div class="card-body"><h2 class="h6">Income and expenses</h2><canvas id="report-chart"></canvas></div></div></div><div class="col-xl-6"><div class="card"><div class="card-body"><h2 class="h6">Outstanding invoices</h2><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Invoice</th><th>Due</th><th>Total</th><th>Paid</th><th>Balance</th></tr></thead><tbody id="outstanding-body"></tbody></table></div></div></div></div></div><div class="card mt-3"><div class="card-body"><h2 class="h6">Transaction and expense category summary</h2><div id="transaction-report"></div></div></div>{% endblock %}
