<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account · FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/app.css" rel="stylesheet">
</head>

<!-- CHANGE: Added Bootstrap flexbox classes to body -->
<body class="auth-bg">
    
    <!-- CHANGE: Added a wrapper div with a max-width and card styling -->
    <div class="auth-card">
        <form onsubmit="return register(event)">
            <div class="auth-mark">F</div>
            <h1 class="h3 mb-2 text-center">Create your account</h1>
            <p class="auth-note text-center mb-4">Set up your workspace and keep your finances in view.</p>
            <div id="message" aria-live="polite"></div>
            
            <label class="form-label" for="register-name">Name</label>
            <input class="form-control mb-3" id="register-name" name="name" required maxlength="150">
            
            <label class="form-label" for="register-email">Email</label>
            <input class="form-control mb-3" type="email" id="register-email" name="email" required>
            
            <label class="form-label" for="register-password">Password (10–128 characters)</label>
            <input class="form-control mb-3" type="password" id="register-password" name="password" minlength="10" maxlength="128" required>
            
            <button class="btn btn-primary w-100 mt-2">Create account</button>
            <a href="/login" class="auth-link d-block mt-3 text-center">Sign in</a>
        </form>
    </div>
    
    <script src="/static/js/app.js"></script>
</body>
</html>
