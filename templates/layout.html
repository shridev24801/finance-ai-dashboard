<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title or 'AI Dashboard' }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/static/css/app.css" rel="stylesheet"></head>
<body><nav class="navbar navbar-dark px-3 px-lg-4 sticky-top"><a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard"><span class="brand-mark">F</span>FinTrack</a><div class="d-flex align-items-center gap-3"><span class="text-white small" id="whoami"></span><button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button></div></nav>
<div class="container-fluid"><div class="row"><aside class="col-lg-2 sidebar py-3"><a data-permission-nav="dashboard.view" class="{{ 'active' if request.url.path == '/dashboard' else '' }}" href="/dashboard">Dashboard</a><a data-permission-nav="customers.view" class="{{ 'active' if request.url.path == '/customers' else '' }}" href="/customers">Customers</a><a data-permission-nav="transactions.view" class="{{ 'active' if request.url.path == '/transactions' else '' }}" href="/transactions">Transactions</a><a data-permission-nav="invoices.view" class="{{ 'active' if request.url.path == '/invoices' else '' }}" href="/invoices">Invoices</a><a data-permission-nav="payments.view" class="{{ 'active' if request.url.path == '/payments' else '' }}" href="/payments">Payments</a><a data-permission-nav="reports.view" class="{{ 'active' if request.url.path == '/reports' else '' }}" href="/reports">Reports</a><a data-permission-nav="insights.view" class="{{ 'active' if request.url.path == '/ai-insights' else '' }}" href="/ai-insights">AI Insights</a><a data-admin-only class="{{ 'active' if request.url.path == '/team' else '' }}" href="/team">Team access</a></aside><main class="col-lg-10 p-3 p-lg-4"><div id="toast-area" class="toast-area" aria-live="polite"></div><div class="page-heading"><div class="eyebrow">FINTRACK WORKSPACE</div><h1 class="h3 mb-0">{{ title }}</h1><p class="page-subtitle">A clear view of your business activity and financial health.</p></div>{% block content %}{% endblock %}</main></div></div>
<div class="modal fade" id="editor-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><form id="editor-form"><div class="modal-header"><h2 class="modal-title fs-5" id="editor-title">Edit</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><div id="editor-error"></div><div id="editor-fields" class="row g-3"></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="editor-submit">Save</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script><script src="/static/js/app.js"></script></body></html>
